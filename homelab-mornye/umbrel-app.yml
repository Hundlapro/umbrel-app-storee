manifestVersion: 1
id: homelab-mornye
name: Mornye
tagline: Music player for your own library, in the browser
icon: https://raw.githubusercontent.com/mornyeapp/Mornye/main/assets/brand/logo/png/mornye-badge@4x.png
category: Media
version: "5.4.5"
port: 8474
description: >-
  Mornye is a desktop music player for your personal library, built with
  Flutter and Rust. This app runs the Linux version on your Umbrel and
  streams its window and audio to your browser.


  Put your music in Files -> Downloads -> music, then add /music in Mornye
  under Settings -> Local Library. Mornye can also play from SMB, WebDAV and
  HTTP servers.
developer: Mornye
website: https://github.com/mornyeapp/Mornye
submitter: Homelab
submission: https://github.com/mornyeapp/Mornye-Desktop
repo: https://github.com/mornyeapp/Mornye
support: https://github.com/mornyeapp/Mornye-Desktop/issues
gallery:
  - https://raw.githubusercontent.com/mornyeapp/Mornye-Desktop/main/assets/screenshots/desktop-dark.png
  - https://raw.githubusercontent.com/mornyeapp/Mornye-Desktop/main/assets/screenshots/desktop-light.png
releaseNotes: >-
  Mornye v5.4.5 on the Selkies browser desktop.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
