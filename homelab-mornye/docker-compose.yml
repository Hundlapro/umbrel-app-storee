version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1
      APP_HOST: homelab-mornye_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/hundlapro/mornye:v5.4.5
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TITLE=Mornye
      # Set to "false" to fall back to X11 if the window stays black.
      - PIXELFLUX_WAYLAND=true
    volumes:
      # Mornye settings and library database.
      - ${APP_DATA_DIR}/data/config:/config
      # Your music: Files -> Downloads -> music on Umbrel. Add /music in
      # Mornye under Settings -> Local Library.
      - ${UMBREL_ROOT}/data/storage/downloads/music:/music
    shm_size: "1gb"
