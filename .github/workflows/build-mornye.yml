name: Build Mornye image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["images/mornye/**", ".github/workflows/build-mornye.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mornye" >> "$GITHUB_OUTPUT"
          echo "ver=$(grep -m1 'ARG MORNYE_VERSION=' images/mornye/Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/mornye
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.ver }}
            ${{ steps.img.outputs.name }}:latest
