name: Build God's Eye View image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]

env:
  # Pinned upstream commit. Bump this (and the tag in
  # homelab-gods-eye-view/docker-compose.yml) to update the app.
  UPSTREAM_REF: 84ca483a8de5e5228e343fd38be0724c9dde2e45

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bilawalsidhu/gods-eye-view
          ref: ${{ env.UPSTREAM_REF }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gods-eye-view" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.UPSTREAM_REF }}
            ${{ steps.img.outputs.name }}:latest
