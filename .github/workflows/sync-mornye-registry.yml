name: Sync Mornye registry

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mornye/allowlist.txt", "scripts/filter_registry.py", ".github/workflows/sync-mornye-registry.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/filter_registry.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- mornye/registry.json && git ls-files --error-unmatch mornye/registry.json >/dev/null 2>&1; then
            echo "no changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add mornye/registry.json
          git commit -m "Sync Mornye registry"
          git push
