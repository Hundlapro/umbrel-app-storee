description: >-
  The web interface (--web mode) of Mornye Python: resolve track metadata,
  manage a local library with a built-in player, synced lyrics, playlists,
  and CSV/M3U import.


  Files are saved to Files -> Downloads -> music, the same folder the Mornye
  desktop app reads.


  Mornye ships with no download providers and no extension source. Anything
  you install from a registry of your choosing is your responsibility; check
  the terms of the services involved and your local law.
