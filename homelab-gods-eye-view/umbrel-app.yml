description: >-
  A spy-satellite simulator in your browser, except the data is real:
  satellites, flights, ships, weather and public cameras on a photorealistic
  3D globe.


  Runs keyless out of the box (Esri imagery, anonymous OpenSky). Optional
  provider keys can be added as environment variables in this app's
  docker-compose.yml.
